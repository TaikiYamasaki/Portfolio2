<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAIKI YAMASAKI | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header>
    <a href="#top" class="logo">TY</a>
    <nav>
      <a href="#works" class="active">WORKS</a>
      <a href="#about">ABOUT</a>
      <a href="#skill">SKILL</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <div class="scroll-rail">
    <span class="label">SCROLL</span>
    <span class="line"></span>
  </div>

  <section id="top">
    <div class="dot-field"></div>
    <div class="hero-grid">

      <div class="hero-copy">
        <p class="eyebrow">HELLO, I'M</p>
        <h1>TAIKI<br />YAMASAKI</h1>
        <span class="rule"></span>
        <p class="lead">デザインで、伝わる価値をつくる。</p>
        <p class="sub">ブランド、Web、アプリ、グラフィックなど。<br />課題の本質に寄り添い、最適なデザインを提案します。</p>
        <a href="#about" class="view-profile">
          <span class="arrow-circle">→</span>
          <span class="view-profile-label">more about me!</span>
        </a>
      </div>

      <div class="hero-art">
        <div class="blob"></div>
        <div class="glow"></div>
        <div class="mockup-wrap">
          <div class="mockup-inner">
            <div id="hero-mockup" class="slot"><span class="slot-label">ノートPCモックアップ<br />(Webデザイン)</span></div>
            <div id="hero-phone" class="slot"><span class="slot-label">スマホ<br />モックアップ</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="works">
    <div class="works-head">
      <h2>WORKS</h2>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="works-grid" id="works-grid"></div>
  </section>

  <section id="contact">
    <div class="contact-inner">
      <div>
        <h2>一緒に、価値をつくりましょう。</h2>
        <p>デザインのご相談・お見積りは、お気軽にお問い合わせください。</p>
      </div>
      <a href="mailto:hello@example.com" class="contact-btn">
        <span>CONTACT ME</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </section>

  <footer>
    <p>© TAIKI YAMASAKI PORTFOLIO</p>
  </footer>
</div>

<script src="main.js"></script>
</body>
</html>
